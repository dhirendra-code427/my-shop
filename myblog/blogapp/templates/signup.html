{% extends "index.html" %}
{% load static %}
{% block main %}
<div class="container login-container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h1 class="text-center">SignUp</h1>
            <div class="card">
                <div class="card-body">
                    <form id="loginForm " method="post" action="#">
                        <div class="alert alert-danger" role="alert">
                            <p class=" text-center"><span>Hi User Sign Up Here</span>
                            </p>
                        </div>
                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" class="form-control" id="username" name="username" required>
                        </div>
                        <div class="mb-3">
                            <label for="Mobile Number" class="form-label">Mobile Number</label>
                            <input type="text" class="form-control" id="username" name="Mobile Number" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Create password</label>
                            <input type="text" class="form-control" id="username" name="password" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Re-Enter Password</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">SignUp</button>
                    </form>
                    <div id="message" class="mt-3 text-danger text-center"></div>
                </div>
            </div>
        </div>
    </div>
</div>








{% endblock %}
