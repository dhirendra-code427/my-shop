{% extends "index.html" %}
{% load static %}
{% block main%}
    <div class="container login-container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <h1 class="text-center">Contact Us </h1>
                <div class="card">
                    <div class="card-body">
                        <form id="loginForm " method="post" action="#">
                            <div class="alert alert-primary text-center"> Welcome to Contact Us Page</div>
                            <div class="mb-3">
                                <label for="username" class="form-label">Enter Your Name</label>
                                <input type="text" class="form-control" id="username" name="username" required>
                            </div>
                            <div class="mb-3">
                                <label for="username" class="form-label">Enter Mobile No</label>
                                <input type="text" class="form-control" id="username" name="username" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Query</label>
                                <input type="password" class="form-control" id="password" name="password" required>
                            </div>
                             <div class="mb-3">
                                <label for="Address" class="form-control">Enter Your Address</label>
                                <input type="address" class="form-control" id="address" name="address" required>
                             </div>

                            <button type="submit" class="btn btn-primary w-100">Submit</button>
                        </form>
                        <div id="message" class="mt-3 text-danger text-center"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock%}
