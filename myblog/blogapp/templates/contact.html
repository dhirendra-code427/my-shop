{% extends "index.html" %}
{% load static %}
{% block main%}
    <div class="container login-container">
        <div class="row justify-content-center">
            <div class="col-sm-10 mx-auto mt-3">
                <div class="row">
                    {% if msg %}
                    <div class="col-sm-12">
                        <div class="alert alert-success" role="alert">{{msg}}</div>
                    </div>
                    {% endif %}
                </div>        
            <div class="col-md-6">
                <h1 class="text-center">Contact Us </h1>
                <div class="card">
                    <div class="card-body">
                        <form id="loginForm " method="post" action="#">
                            {% csrf_token %}
                            <div class="alert alert-primary text-center"> Welcome to Contact Us Page</div>
                            <div class="mb-3">
                                <label for="name" class="form-label">Enter Your Name</label>
                                <input type="text" class="form-control" id="name" name="name" required>
                            </div>
                            <div class="mb-3">
                                <label for="emailaddress" class="form-label">E-Mail Address</label>
                                <input type="e-Mail" class="form-control" id="emailaddress" name="emailaddress" required>
                            </div>
                            <div class="mb-3">
                                <label for="enquirytext" class="form-label">QueryText</label>
                                <input type="text" class="form-control" id="enquirytext" name="enquirytext" required>
                            </div>
                             <div class="mb-3">
                                <label for="address" class="form-control">Enter Your Address</label>
                                <input type="address" class="form-control" id="address" name="address" required>
                             </div>

                            <button type="submit" class="btn btn-primary w-100">Submit</button>
                        </form>
                        <div id="message" class="mt-3 text-danger text-center"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock%}
